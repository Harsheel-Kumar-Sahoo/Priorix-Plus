<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priorix</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Priorix">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e3e8f0;--accent:#4f46e5;--accent2:#0ea5e9;--soft:#eef2ff;--hi:#e11d48;--md:#d97706;--lo:#059669;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;background-image:radial-gradient(900px 400px at 85% -10%,#dbeafe 0,transparent 60%),radial-gradient(700px 360px at -10% 0,#e0e7ff 0,transparent 60%);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:#c7d0e0;transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.hero{background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;border-radius:20px;padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 12px 30px -14px rgba(79,70,229,.6)}
.hero h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85;font-size:14px}
.hero .btn{background:#fff;color:var(--accent);border-color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px;font-weight:500}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.4s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.search{flex:1 1 180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{border:0;outline:0;background:none;padding:10px 0;width:100%}
select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.task{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:14px;padding:14px;margin-bottom:10px;transition:.15s}
.task:hover{box-shadow:0 6px 18px -12px rgba(15,23,42,.4)}
.task.done{opacity:.55}.task.done h3{text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid #c3cbda;background:#fff;display:grid;place-items:center;cursor:pointer;color:#fff;flex:none;margin-top:1px}
.done .chk{background:var(--lo);border-color:var(--lo)}
.chk svg{width:14px;height:14px;stroke-width:3;opacity:0}.done .chk svg{opacity:1}
.body{flex:1;min-width:0}
.task h3{margin:0;font-size:16px;font-weight:700;word-break:break-word}
.notes{color:var(--muted);font-size:13px;margin:3px 0 0;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#f1f5f9;color:#475569;max-width:100%}
.pill svg{width:13px;height:13px}
.pill.p-high{background:#ffe4e9;color:var(--hi)}.pill.p-medium{background:#fef3c7;color:var(--md)}.pill.p-low{background:#d1fae5;color:var(--lo)}
.pill.late{background:#ffe4e9;color:var(--hi)}.pill.soon{background:#fef3c7;color:var(--md)}
a.pill{text-decoration:none;background:var(--soft);color:var(--accent)}
a.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:2px}
.icon{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.icon:hover{background:#f1f5f9;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:var(--surface);border:1px dashed #cbd5e1;border-radius:16px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 24px -8px rgba(79,70,229,.7);border-radius:16px;padding:14px 18px}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(15,23,42,.5)}
dialog::backdrop{background:rgba(15,23,42,.4);backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.dh h2{margin:0;font-size:18px}
.db{padding:8px 18px 18px;overflow:auto}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:0}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e0e7ff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:600;cursor:pointer}
.seg button.on[data-p=high]{background:#ffe4e9;border-color:var(--hi);color:var(--hi)}
.seg button.on[data-p=medium]{background:#fef3c7;border-color:var(--md);color:var(--md)}
.seg button.on[data-p=low]{background:#d1fae5;border-color:var(--lo);color:var(--lo)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border-radius:99px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0;display:grid}
.chip svg{width:14px;height:14px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.first{background:linear-gradient(135deg,#eef2ff,#e0f2fe);border-radius:16px;padding:16px;border:1px solid #dbe4ff}
.first small{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.first h3{margin:4px 0 6px;font-size:20px;letter-spacing:-.01em}
.why{color:var(--muted);font-size:13px}
.next{list-style:none;margin:14px 0 0;padding:0;counter-reset:n}
.next li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.next li::before{counter-increment:n;content:counter(n)"";width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.next li div{flex:1;min-width:0}.next b{display:block;font-size:14px}
.next .why{font-size:12px}
@media(max-width:480px){.stat b{font-size:19px}.hero{padding:16px}.row{grid-template-columns:1fr}.fab span{display:none}.fab{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" id="logo"></div>Priorix</div>
    <div style="display:flex;gap:6px"><button class="btn sm" id="installBtn" hidden></button><button class="btn sm ghost" id="clearDone"></button></div>
  </header>

  <section class="hero">
    <div><h2>Not sure where to start?</h2><p>Let Priorix rank your tasks by deadline and priority.</p></div>
    <button class="btn" id="whatBtn"></button>
  </section>

  <section class="stats">
    <div class="stat"><b id="sActive">0</b><span>Active</span></div>
    <div class="stat"><b id="sLate">0</b><span>Overdue</span></div>
    <div class="stat"><b id="sPct">0%</b><span>Completed</span><div class="bar"><i id="bar"></i></div></div>
  </section>

  <div class="tools">
    <label class="search" style="margin:0;text-transform:none;letter-spacing:0;font-weight:400"><span id="sIc"></span><input id="q" placeholder="Search tasks" aria-label="Search tasks"></label>
    <select id="sort" aria-label="Sort"><option value="smart">Smart order</option><option value="deadline">Deadline</option><option value="priority">Priority</option><option value="new">Newest</option></select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<button class="btn primary fab" id="addBtn"></button>

<dialog id="dlg">
  <div class="dh"><h2 id="dTitle">New task</h2><button class="icon" data-close aria-label="Close" id="x1"></button></div>
  <div class="db">
    <label for="fTitle">Task</label><input class="in" id="fTitle" placeholder="What needs doing?" maxlength="140">
    <label for="fNotes">Notes</label><textarea class="in" id="fNotes" rows="2" placeholder="Optional details"></textarea>
    <div class="row">
      <div><label for="fDate">Deadline date</label><input class="in" type="date" id="fDate"></div>
      <div><label for="fTime">Deadline time</label><input class="in" type="time" id="fTime"></div>
    </div>
    <label>Priority</label>
    <div class="seg" id="seg"><button type="button" data-p="low">Low</button><button type="button" data-p="medium">Medium</button><button type="button" data-p="high">High</button></div>
    <label for="fLink">Links</label>
    <div style="display:flex;gap:8px"><input class="in" id="fLink" placeholder="https://…" inputmode="url"><button class="btn" type="button" id="addLink">Add</button></div>
    <div class="chips" id="chips"></div>
    <div class="foot"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="save" type="button">Save task</button></div>
  </div>
</dialog>

<dialog id="wdlg">
  <div class="dh"><h2>Your game plan</h2><button class="icon" data-close aria-label="Close" id="x2"></button></div>
  <div class="db" id="wbody"></div>
</dialog>

<script>
const P={
dl:'<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M20 6 9 17l-5-5"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
wand:'<path d="m15 4 1 2 2 1-2 1-1 2-1-2-2-1 2-1zM5 14l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 14l.7 1.3L21 16l-1.3.7L19 18l-.7-1.3L17 16l1.3-.7zM4 20 17 7"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',sweep:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[],filter='active',editId=null,pri='medium',links=[];
try{tasks=JSON.parse(localStorage.getItem('priorix')||'[]')}catch(e){tasks=[]}
const save=()=>{try{localStorage.setItem('priorix',JSON.stringify(tasks))}catch(e){}};
const W={high:3,medium:2,low:1};

$('#logo').innerHTML=ic('layers').replace('class="i"','class="i" style="width:20px;height:20px"');
$('#whatBtn').innerHTML=ic('wand')+'What to do';
$('#addBtn').innerHTML=ic('plus')+'<span>Add task</span>';
$('#installBtn').innerHTML=ic('dl')+'Install';
$('#clearDone').innerHTML=ic('sweep')+'Clear done';
$('#sIc').innerHTML=ic('search');
$('#x1').innerHTML=$('#x2').innerHTML=ic('x');
$('#addLink').innerHTML=ic('plus')+'Add';

const due=t=>t.date?new Date(t.date+'T'+(t.time||'23:59')):null;
function urgency(t){const d=due(t);if(!d)return{s:0,txt:'No deadline set'};const h=(d-Date.now())/36e5;
 if(h<0)return{s:50,txt:'Already overdue'};if(h<3)return{s:40,txt:'Due within hours'};if(h<24)return{s:30,txt:'Due in the next 24 hours'};
 if(h<72)return{s:20,txt:'Due within 3 days'};if(h<168)return{s:10,txt:'Due this week'};return{s:3,txt:'Plenty of time left'}}
const score=t=>W[t.pri]*12+urgency(t).s;
const why=t=>`${cap(t.pri)} priority · ${urgency(t).txt}`;
const cap=s=>s[0].toUpperCase()+s.slice(1);
function dueLabel(t){const d=due(t);if(!d)return null;const h=(d-Date.now())/36e5;
 const day=new Date(d);day.setHours(0,0,0,0);const now=new Date();now.setHours(0,0,0,0);const diff=Math.round((day-now)/864e5);
 const tm=t.time?' · '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
 let l=diff===0?'Today':diff===1?'Tomorrow':d.toLocaleDateString([],{month:'short',day:'numeric'});
 let c='';if(!t.done){if(h<0){c='late';l='Overdue · '+l}else if(h<24)c='soon'}
 return{l:l+tm,c}}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function fixUrl(u){u=u.trim();if(!u)return'';return/^https?:\/\//i.test(u)?u:'https://'+u}

function render(){
 const act=tasks.filter(t=>!t.done),dn=tasks.length-act.length;
 $('#sActive').textContent=act.length;
 $('#sLate').textContent=act.filter(t=>{const d=due(t);return d&&d<Date.now()}).length;
 const pct=tasks.length?Math.round(dn/tasks.length*100):0;
 $('#sPct').textContent=pct+'%';$('#bar').style.width=pct+'%';
 $('#tabs').innerHTML=[['active','Active',act.length],['done','Done',dn],['all','All',tasks.length]]
  .map(([k,l,n])=>`<button class="tab ${filter===k?'on':''}" data-tab="${k}">${l} · ${n}</button>`).join('');
 const q=$('#q').value.trim().toLowerCase(),s=$('#sort').value;
 let L=tasks.filter(t=>filter==='all'||(filter==='done')===t.done).filter(t=>!q||(t.title+' '+(t.notes||'')).toLowerCase().includes(q));
 const dd=t=>due(t)?+due(t):Infinity;
 L.sort(s==='deadline'?(a,b)=>dd(a)-dd(b):s==='priority'?(a,b)=>W[b.pri]-W[a.pri]||dd(a)-dd(b):s==='new'?(a,b)=>b.created-a.created:(a,b)=>score(b)-score(a));
 $('#list').innerHTML=L.length?L.map(card).join(''):`<div class="empty">${tasks.length?'Nothing matches here.':'No tasks yet. Tap “Add task” to begin.'}</div>`;
}
function card(t){
 const d=dueLabel(t),pc={high:'var(--hi)',medium:'var(--md)',low:'var(--lo)'}[t.pri];
 return `<article class="task ${t.done?'done':''}" style="--pc:${pc}" data-id="${t.id}">
 <button class="chk" data-act="toggle" aria-label="Toggle done">${ic('check')}</button>
 <div class="body"><h3>${esc(t.title)}</h3>${t.notes?`<p class="notes">${esc(t.notes)}</p>`:''}
 <div class="meta"><span class="pill p-${t.pri}">${ic('flag')}${cap(t.pri)}</span>
 ${d?`<span class="pill ${d.c}">${ic(t.time?'clock':'cal')}${d.l}</span>`:''}
 ${(t.links||[]).map(u=>`<a class="pill" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('link')}<span>${esc(host(u))}</span></a>`).join('')}</div></div>
 <div class="acts"><button class="icon" data-act="edit" aria-label="Edit">${ic('edit')}</button><button class="icon" data-act="del" aria-label="Delete">${ic('trash')}</button></div></article>`}

function openForm(id){
 editId=id||null;const t=tasks.find(x=>x.id===id)||{title:'',notes:'',date:'',time:'',pri:'medium',links:[]};
 $('#dTitle').textContent=id?'Edit task':'New task';
 $('#fTitle').value=t.title;$('#fNotes').value=t.notes||'';$('#fDate').value=t.date||'';$('#fTime').value=t.time||'';
 pri=t.pri;links=[...(t.links||[])];$('#fLink').value='';segUp();chipUp();$('#dlg').showModal();
}
const segUp=()=>document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===pri));
const chipUp=()=>$('#chips').innerHTML=links.map((u,i)=>`<span class="chip"><span>${esc(host(u))}</span><button type="button" data-rl="${i}" aria-label="Remove link">${ic('x')}</button></span>`).join('');
function addLink(){const u=fixUrl($('#fLink').value);if(u){links.push(u);$('#fLink').value='';chipUp()}}

function saveTask(){
 const title=$('#fTitle').value.trim();if(!title){$('#fTitle').focus();return}
 addLink();
 const o={title,notes:$('#fNotes').value.trim(),date:$('#fDate').value,time:$('#fDate').value?$('#fTime').value:'',pri,links:[...links]};
 if(editId)Object.assign(tasks.find(t=>t.id===editId),o);else tasks.push({id:Date.now().toString(36),done:false,created:Date.now(),...o});
 save();$('#dlg').close();render();
}

function plan(){
 const L=tasks.filter(t=>!t.done).sort((a,b)=>score(b)-score(a));
 if(!L.length){$('#wbody').innerHTML=`<div class="empty">You’re all clear. Add a task or enjoy the break.</div>`}
 else{const f=L[0];
  $('#wbody').innerHTML=`<div class="first"><small>Start here</small><h3>${esc(f.title)}</h3><div class="why">${why(f)}</div>
  <div class="foot" style="margin-top:12px;justify-content:flex-start">
  <button class="btn primary sm" data-wdone="${f.id}">${ic('check')}Mark done</button>
  ${(f.links||[])[0]?`<a class="btn sm" style="text-decoration:none" href="${esc(f.links[0])}" target="_blank" rel="noopener noreferrer">${ic('link')}Open link</a>`:''}</div></div>
  ${L.length>1?`<ol class="next">${L.slice(1,8).map(t=>`<li><div><b>${esc(t.title)}</b><span class="why">${why(t)}</span></div></li>`).join('')}</ol>`:''}`}
 $('#wdlg').showModal();
}

document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let el;
 if(g('[data-close]'))g('dialog').close();
 else if(el=g('[data-tab]')){filter=el.dataset.tab;render()}
 else if(el=g('[data-p]')){pri=el.dataset.p;segUp()}
 else if(el=g('[data-rl]')){links.splice(+el.dataset.rl,1);chipUp()}
 else if(el=g('[data-wdone]')){const t=tasks.find(x=>x.id===el.dataset.wdone);if(t){t.done=true;save();render();plan()}}
 else if(el=g('[data-act]')){const id=g('.task').dataset.id,a=el.dataset.act;
  if(a==='toggle'){const t=tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
  else if(a==='edit')openForm(id);
  else if(a==='del'&&confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);save();render()}}
});
$('#addBtn').onclick=()=>openForm();$('#whatBtn').onclick=plan;$('#save').onclick=saveTask;$('#addLink').onclick=addLink;
$('#fLink').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addLink()}});
$('#fTitle').addEventListener('keydown',e=>{if(e.key==='Enter')saveTask()});
$('#q').oninput=render;$('#sort').onchange=render;
$('#clearDone').onclick=()=>{if(tasks.some(t=>t.done)&&confirm('Remove all completed tasks?')){tasks=tasks.filter(t=>!t.done);save();render()}};
render();setInterval(render,60000);
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#installBtn').hidden=false});
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;dp=null});
$('#installBtn').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('#installBtn').hidden=true};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
